services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agenthelper
      POSTGRES_PASSWORD: agenthelper
      POSTGRES_DB: agenthelper
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenthelper"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
