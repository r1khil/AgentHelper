name: Validate application
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agenthelper
          POSTGRES_PASSWORD: agenthelper
          POSTGRES_DB: agenthelper_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agenthelper"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://agenthelper:agenthelper@localhost:5432/agenthelper_test
      NEXT_TELEMETRY_DISABLED: "1"
      AUTH_MODE: entra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:worker
      - run: npm audit --omit=dev
